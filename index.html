<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GoldEdge • Live Gold Signals</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body { background: #0a0f1e; color: #e2e8f0; }
    .signal-card { transition: all 0.2s ease; }
    .signal-card:hover { transform: translateY(-2px); }
    .buy { border-left: 3px solid #22c55e; }
    .sell { border-left: 3px solid #ef4444; }
  </style>
</head>
<body class="min-h-screen">
  <header class="bg-[#0f172a] border-b border-slate-800/80 sticky top-0 z-50 backdrop-blur">
    <div class="max-w-6xl mx-auto px-4 py-3.5 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 bg-gradient-to-br from-amber-400 to-amber-600 rounded-md flex items-center justify-center text-lg font-bold text-slate-900">G</div>
        <div>
          <h1 class="text-lg font-semibold tracking-tight">GoldEdge</h1>
          <p class="text-[11px] text-slate-500 -mt-0.5">AI-Powered XAUUSD Signals</p>
        </div>
      </div>
      <div class="flex items-center gap-5">
        <div class="text-right">
          <p class="text-[10px] text-slate-500 uppercase tracking-wider">Live</p>
          <p id="livePrice" class="text-base font-mono font-medium">—</p>
        </div>
        <span class="text-xs bg-emerald-500/10 text-emerald-400 px-2.5 py-1 rounded-full border border-emerald-500/20">Free</span>
      </div>
    </div>
  </header>
  <main class="max-w-6xl mx-auto px-4 py-6">
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6 text-sm">
      <div class="bg-slate-900/40 rounded-lg p-3 border border-slate-800"><p class="text-slate-500 text-xs">Win Rate</p><p class="text-xl font-semibold text-emerald-400">68%</p></div>
      <div class="bg-slate-900/40 rounded-lg p-3 border border-slate-800"><p class="text-slate-500 text-xs">Active</p><p class="text-xl font-semibold" id="activeCount">2</p></div>
      <div class="bg-slate-900/40 rounded-lg p-3 border border-slate-800"><p class="text-slate-500 text-xs">This Month</p><p class="text-xl font-semibold">42</p></div>
      <div class="bg-slate-900/40 rounded-lg p-3 border border-slate-800"><p class="text-slate-500 text-xs">Next Event</p><p class="text-xl font-semibold text-amber-400">NFP</p></div>
    </div>
    <div class="flex gap-1 mb-5 text-sm border-b border-slate-800 overflow-x-auto">
      <button onclick="showTab('signals')" id="tab-signals" class="px-3 py-2 text-white border-b-2 border-amber-500 font-medium whitespace-nowrap">Signals</button>
      <button onclick="showTab('scalping')" id="tab-scalping" class="px-3 py-2 text-slate-500 hover:text-slate-300 whitespace-nowrap">Scalping</button>
      <button onclick="showTab('news')" id="tab-news" class="px-3 py-2 text-slate-500 hover:text-slate-300 whitespace-nowrap">News</button>
      <button onclick="showTab('history')" id="tab-history" class="px-3 py-2 text-slate-500 hover:text-slate-300 whitespace-nowrap">History</button>
    </div>
    <div id="signals" class="space-y-3"></div>
    <div id="scalping" class="hidden space-y-3"></div>
    <div id="news" class="hidden space-y-3"></div>
    <div id="history" class="hidden"></div>
  </main>
  <footer class="border-t border-slate-800/60 mt-10 py-4 text-center text-[11px] text-slate-600">GoldEdge • Fully automatic AI signals • Not financial advice</footer>
  <script>
    let livePrice = 0; let signals = []; let scalps = [];
    const events = [{name:"Non-Farm Payrolls (NFP)",date:"Fri Nov 6",time:"08:30 ET",impact:"High",note:"Expect 80–150 pip moves. Wait for spike then fade extremes or trade confirmed breakouts."},{name:"US CPI",date:"Tue Nov 10",time:"08:30 ET",impact:"High",note:"Inflation data. Hotter print typically pressures gold; cooler print supports it."},{name:"US PPI",date:"Fri Nov 13",time:"08:30 ET",impact:"High",note:"Producer prices. Can move gold similarly to CPI. Watch for surprises vs forecast."},{name:"FOMC Rate Decision",date:"Wed Dec 9",time:"14:00 ET",impact:"High",note:"Includes projections/dot plot. Major volatility expected."}];
    const history = [{time:"Nov 4",dir:"BUY",entry:"4110",status:"TP2 Hit"},{time:"Nov 3",dir:"SELL",entry:"4135",status:"Stopped"},{time:"Nov 1",dir:"BUY",entry:"4098",status:"TP1 Hit"}];
    function showTab(tab) { ['signals','scalping','news','history'].forEach(t => { document.getElementById(t).classList.add('hidden'); const btn = document.getElementById('tab-'+t); btn.classList.remove('border-b-2','border-amber-500','text-white','font-medium'); btn.classList.add('text-slate-500'); }); document.getElementById(tab).classList.remove('hidden'); const active = document.getElementById('tab-'+tab); active.classList.add('border-b-2','border-amber-500','text-white','font-medium'); active.classList.remove('text-slate-500'); }
    function autoStatus(s, price) { const e = parseFloat(s.entry); const sl = parseFloat(s.sl); const tp1 = parseFloat(s.tp1); const tp2 = parseFloat(s.tp2); if (s.dir === "BUY") { if (price <= sl) return "Stopped"; if (price >= tp2) return "TP2 Hit"; if (price >= tp1) return "TP1 Hit"; return "Active"; } else { if (price >= sl) return "Stopped"; if (price <= tp2) return "TP2 Hit"; if (price <= tp1) return "TP1 Hit"; return "Active"; } }
    function generateSignals(price) { if (!price) return; const p = Math.round(price * 100) / 100; signals = [{dir: p > 4120 ? "BUY" : "SELL", conf: "High", status: "Active", time: "Live", entry: (p - 3).toFixed(2), sl: (p - 18).toFixed(2), tp1: (p + 18).toFixed(2), tp2: (p + 35).toFixed(2), context: `AI analysis: Price near ${p}. Looking for continuation after liquidity sweep. HTF structure supportive. Invalidation on break of SL.`, type: "swing"}]; scalps = [{dir:"BUY",conf:"Momentum",status:"Active",time:"Live",entry:(p + 1.5).toFixed(2),sl:(p - 6).toFixed(2),tp1:(p + 10).toFixed(2),tp2:(p + 16).toFixed(2),context:"AI scalp: Clear short-term momentum. Enter on minor pullback. Tight stop mandatory. Max 0.5-1% risk.",type:"scalp"},{dir:"SELL",conf:"Momentum",status:"Active",time:"Live",entry:(p + 12).toFixed(2),sl:(p + 20).toFixed(2),tp1:(p + 2).toFixed(2),tp2:(p - 5).toFixed(2),context:"AI scalp: Fade only on rejection. No chasing. Skip if spread wide.",type:"scalp"}]; signals.forEach(s => s.status = autoStatus(s, price)); scalps.forEach(s => s.status = autoStatus(s, price)); }
    function distanceFromLive(entry) { if (!livePrice) return ''; const diff = (parseFloat(entry) - livePrice).toFixed(1); const color = diff > 0 ? 'text-red-400' : 'text-emerald-400'; return `<span class="text-[10px] ${color}">(${diff > 0 ? '+' : ''}${diff} from live)</span>`; }
    function renderCard(s, isScalp = false) { const statusColor = s.status.includes("TP") ? "bg-emerald-500/10 text-emerald-400" : s.status === "Stopped" ? "bg-red-500/10 text-red-400" : "bg-blue-500/10 text-blue-400"; return `<div class="signal-card bg-slate-900/60 rounded-lg p-4 border border-slate-800 ${s.dir === 'BUY' ? 'buy' : 'sell'}"><div class="flex justify-between items-start mb-2.5"><div class="flex items-center gap-2 flex-wrap"><span class="${s.dir === 'BUY' ? 'bg-emerald-500' : 'bg-red-500'} text-white text-[10px] font-bold px-1.5 py-0.5 rounded">${s.dir}</span><span class="text-xs text-slate-400">${isScalp ? 'Scalp' : 'XAUUSD'}</span><span class="text-[10px] text-amber-400">${s.conf}</span><span class="text-[10px] ${statusColor} px-1.5 py-0.5 rounded">${s.status}</span><span class="text-[10px] bg-purple-500/10 text-purple-400 px-1.5 py-0.5 rounded">AI</span></div><span class="text-[10px] text-slate-500">${s.time}</span></div><div class="grid grid-cols-4 gap-3 text-xs mb-3 font-mono"><div><span class="text-slate-500">Entry</span><p class="font-medium">${s.entry} ${distanceFromLive(s.entry)}</p></div><div><span class="text-slate-500">SL</span><p class="text-red-400">${s.sl}</p></div><div><span class="text-slate-500">TP1</span><p class="text-emerald-400">${s.tp1}</p></div><div><span class="text-slate-500">TP2</span><p class="text-emerald-400">${s.tp2}</p></div></div><div class="bg-slate-950/50 rounded p-2.5 text-xs leading-relaxed"><span class="text-amber-400 font-medium">${isScalp ? 'Rules' : 'Context'}:</span> ${s.context}</div>${isScalp ? '<p class="text-[10px] text-amber-300 mt-2">Risk: 0.5–1% max. Skip if spread > 30 points or during high-impact news.</p>' : '<p class="text-[10px] text-slate-500 mt-2">Risk 1–1.5% max. Move to BE after TP1.</p>'}</div>`; }
    function renderSignals() { const active = signals.filter(s => s.status === "Active"); document.getElementById('signals').innerHTML = active.map(s => renderCard(s)).join('') || '<p class="text-slate-500 text-sm">No active signals right now. AI is monitoring.</p>'; }
    function renderScalping() { const active = scalps.filter(s => s.status === "Active"); document.getElementById('scalping').innerHTML = `<div class="bg-amber-500/10 border border-amber-500/30 rounded-lg p-3 text-xs text-amber-200 mb-3"><strong>High risk.</strong> Tight stops only. Max 0.5–1% risk per trade. Skip if spreads are wide or during news.</div>${active.map(s => renderCard(s, true)).join('') || '<p class="text-slate-500 text-sm">No active scalps.</p>'}`; }
    function renderNews() { document.getElementById('news').innerHTML = events.map(e => `<div class="bg-slate-900/60 rounded-lg p-4 border border-amber-500/20"><div class="flex items-center gap-2 mb-2"><i class="fas fa-bolt text-amber-400 text-sm"></i><span class="font-medium">${e.name}</span><span class="ml-auto text-[10px] bg-amber-500/10 text-amber-400 px-1.5 py-0.5 rounded">${e.impact}</span></div><p class="text-xs text-slate-400 mb-2">${e.date} • ${e.time}</p><div class="bg-slate-950/50 rounded p-2.5 text-xs">${e.note}</div></div>`).join(''); }
    function renderHistory() { const closed = [...history, ...signals.filter(s => s.status !== "Active"), ...scalps.filter(s => s.status !== "Active")]; document.getElementById('history').innerHTML = `<div class="bg-slate-900/60 rounded-lg border border-slate-800 overflow-hidden text-xs"><table class="w-full"><thead class="bg-slate-950"><tr class="text-slate-500"><th class="text-left p-2.5">Time</th><th class="text-left p-2.5">Dir</th><th class="text-left p-2.5">Entry</th><th class="text-left p-2.5">Status</th></tr></thead><tbody>${closed.map(h => `<tr class="border-t border-slate-800"><td class="p-2.5">${h.time || 'Live'}</td><td class="${h.dir === 'BUY' ? 'text-emerald-400' : 'text-red-400'}">${h.dir}</td><td>${h.entry}</td><td>${h.status}</td></tr>`).join('')}</tbody></table></div>`; }
    async function fetchGoldPrice() { try { const res = await fetch('https://xaus.com/api/v1/spot?compact=1'); const data = await res.json(); livePrice = data.spot_usd_oz || data.xau?.price || 0; if (livePrice) { document.getElementById('livePrice').textContent = '$' + livePrice.toFixed(2); generateSignals(livePrice); renderSignals(); renderScalping(); renderHistory(); const activeCount = signals.filter(s => s.status === "Active").length + scalps.filter(s => s.status === "Active").length; document.getElementById('activeCount').textContent = activeCount; } } catch (e) { document.getElementById('livePrice').textContent = '—'; } }
    renderNews(); fetchGoldPrice(); setInterval(fetchGoldPrice, 15000);
  </script>
</body>
</html>
