<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GoldEdge • Live Gold Signals</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body { background: #0a0f1e; color: #e2e8f0; }
    .signal-card { transition: all 0.2s ease; }
    .signal-card:hover { transform: translateY(-2px); }
    .buy { border-left: 3px solid #22c55e; }
    .sell { border-left: 3px solid #ef4444; }
  </style>
</head>
<body class="min-h-screen">
  <header class="bg-[#0f172a] border-b border-slate-800/80 sticky top-0 z-50 backdrop-blur">
    <div class="max-w-6xl mx-auto px-4 py-3.5 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 bg-gradient-to-br from-amber-400 to-amber-600 rounded-md flex items-center justify-center text-lg font-bold text-slate-900">G</div>
        <div>
          <h1 class="text-lg font-semibold tracking-tight">GoldEdge</h1>
          <p class="text-[11px] text-slate-500 -mt-0.5">XAUUSD Signals</p>
        </div>
      </div>
      <div class="flex items-center gap-5">
        <div class="text-right">
          <p class="text-[10px] text-slate-500 uppercase tracking-wider">Live</p>
          <p id="livePrice" class="text-base font-mono font-medium">—</p>
        </div>
        <span class="text-xs bg-emerald-500/10 text-emerald-400 px-2.5 py-1 rounded-full border border-emerald-500/20">Free</span>
      </div>
    </div>
  </header>
  <main class="max-w-6xl mx-auto px-4 py-6">
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6 text-sm">
      <div class="bg-slate-900/40 rounded-lg p-3 border border-slate-800"><p class="text-slate-500 text-xs">Win Rate</p><p class="text-xl font-semibold text-emerald-400" id="winRate">—</p></div>
      <div class="bg-slate-900/40 rounded-lg p-3 border border-slate-800"><p class="text-slate-500 text-xs">Active</p><p class="text-xl font-semibold" id="activeCount">—</p></div>
      <div class="bg-slate-900/40 rounded-lg p-3 border border-slate-800"><p class="text-slate-500 text-xs">This Month</p><p class="text-xl font-semibold" id="monthCount">—</p></div>
      <div class="bg-slate-900/40 rounded-lg p-3 border border-slate-800"><p class="text-slate-500 text-xs">Next Event</p><p class="text-xl font-semibold text-amber-400">NFP</p></div>
    </div>
    <div class="flex gap-1 mb-5 text-sm border-b border-slate-800 overflow-x-auto">
      <button onclick="showTab('signals')" id="tab-signals" class="px-3 py-2 text-white border-b-2 border-amber-500 font-medium whitespace-nowrap">Signals</button>
      <button onclick="showTab('scalping')" id="tab-scalping" class="px-3 py-2 text-slate-500 hover:text-slate-300 whitespace-nowrap">Scalping</button>
      <button onclick="showTab('news')" id="tab-news" class="px-3 py-2 text-slate-500 hover:text-slate-300 whitespace-nowrap">News</button>
      <button onclick="showTab('history')" id="tab-history" class="px-3 py-2 text-slate-500 hover:text-slate-300 whitespace-nowrap">History</button>
      <button onclick="showTab('admin')" id="tab-admin" class="px-3 py-2 text-slate-500 hover:text-slate-300 whitespace-nowrap">Post Signal</button>
    </div>
    <div id="signals" class="space-y-3"></div>
    <div id="scalping" class="hidden space-y-3"></div>
    <div id="news" class="hidden space-y-3"></div>
    <div id="history" class="hidden"></div>
    <div id="admin" class="hidden"></div>
  </main>
  <footer class="border-t border-slate-800/60 mt-10 py-4 text-center text-[11px] text-slate-600">GoldEdge • Free XAUUSD signals • Not financial advice • Use proper risk management</footer>
  <script>
    let signals = JSON.parse(localStorage.getItem('goldedge_signals') || '[]');
    let history = JSON.parse(localStorage.getItem('goldedge_history') || '[]');
    let livePrice = 0;
    const defaultSignals = [{id:1,dir:"BUY",conf:"High",status:"Active",time:"2h ago",entry:4125,sl:4112,tp1:4145,tp2:4165,context:"Liquidity sweep below 4118 + H1 bullish engulfing off 4H demand. HTF bias bullish. Invalidation below 4112.",type:"swing"}];
    const scalps = [{id:101,dir:"BUY",conf:"Momentum",status:"Active",time:"Live",entry:4128.5,sl:4120,tp1:4138,tp2:4145,context:"Clear M5 momentum after liquidity grab. Enter on pullback. Tight stop. Max 0.5-1% risk.",type:"scalp"}];
    const events = [{name:"Non-Farm Payrolls (NFP)",date:"Fri Nov 6",time:"08:30 ET",impact:"High",note:"Expect 80–150 pip moves. Wait for spike then fade extremes or trade confirmed breakouts."},{name:"US CPI",date:"Tue Nov 10",time:"08:30 ET",impact:"High",note:"Inflation data. Hotter print typically pressures gold; cooler print supports it."},{name:"US PPI",date:"Fri Nov 13",time:"08:30 ET",impact:"High",note:"Producer prices. Can move gold similarly to CPI. Watch for surprises vs forecast."},{name:"FOMC Rate Decision",date:"Wed Dec 9",time:"14:00 ET",impact:"High",note:"Includes projections/dot plot. Major volatility expected."}];
    if (signals.length === 0) signals = defaultSignals;
    function save() { localStorage.setItem('goldedge_signals', JSON.stringify(signals)); localStorage.setItem('goldedge_history', JSON.stringify(history)); }
    function showTab(tab) { ['signals','scalping','news','history','admin'].forEach(t => { document.getElementById(t).classList.add('hidden'); const btn = document.getElementById('tab-'+t); btn.classList.remove('border-b-2','border-amber-500','text-white','font-medium'); btn.classList.add('text-slate-500'); }); document.getElementById(tab).classList.remove('hidden'); const active = document.getElementById('tab-'+tab); active.classList.add('border-b-2','border-amber-500','text-white','font-medium'); active.classList.remove('text-slate-500'); if (tab === 'admin') renderAdmin(); }
    function distanceFromLive(entry) { if (!livePrice) return ''; const diff = (entry - livePrice).toFixed(1); const color = diff > 0 ? 'text-red-400' : 'text-emerald-400'; return `<span class="text-[10px] ${color}">(${diff > 0 ? '+' : ''}${diff} from live)</span>`; }
    function renderCard(s, isScalp = false) { const statusOptions = ['Active','Watch','TP1 Hit','TP2 Hit','Stopped','Cancelled']; return `<div class="signal-card bg-slate-900/60 rounded-lg p-4 border border-slate-800 ${s.dir === 'BUY' ? 'buy' : 'sell'}"><div class="flex justify-between items-start mb-2.5"><div class="flex items-center gap-2 flex-wrap"><span class="${s.dir === 'BUY' ? 'bg-emerald-500' : 'bg-red-500'} text-white text-[10px] font-bold px-1.5 py-0.5 rounded">${s.dir}</span><span class="text-xs text-slate-400">${isScalp ? 'Scalp' : 'XAUUSD'}</span><span class="text-[10px] text-amber-400">${s.conf}</span><select onchange="updateStatus(${s.id}, this.value)" class="text-[10px] bg-slate-800 border border-slate-700 rounded px-1 py-0.5">${statusOptions.map(st => `<option ${s.status === st ? 'selected' : ''}>${st}</option>`).join('')}</select></div><span class="text-[10px] text-slate-500">${s.time || 'Just now'}</span></div><div class="grid grid-cols-4 gap-3 text-xs mb-3 font-mono"><div><span class="text-slate-500">Entry</span><p class="font-medium">${s.entry} ${distanceFromLive(s.entry)}</p></div><div><span class="text-slate-500">SL</span><p class="text-red-400">${s.sl}</p></div><div><span class="text-slate-500">TP1</span><p class="text-emerald-400">${s.tp1}</p></div><div><span class="text-slate-500">TP2</span><p class="text-emerald-400">${s.tp2 || '—'}</p></div></div><div class="bg-slate-950/50 rounded p-2.5 text-xs leading-relaxed"><span class="text-amber-400 font-medium">${isScalp ? 'Rules' : 'Context'}:</span> ${s.context}</div>${isScalp ? '<p class="text-[10px] text-amber-300 mt-2">Risk: 0.5–1% max. Skip if spread > 30 points or during high-impact news.</p>' : '<p class="text-[10px] text-slate-500 mt-2">Risk 1–1.5% max. Move to BE after TP1.</p>'}</div>`; }
    function renderSignals() { const container = document.getElementById('signals'); const swing = signals.filter(s => s.type !== 'scalp' && (s.status === 'Active' || s.status === 'Watch')); container.innerHTML = swing.map(s => renderCard(s)).join('') || '<p class="text-slate-500 text-sm">No active signals. Use Post Signal tab.</p>'; }
    function renderScalping() { const container = document.getElementById('scalping'); container.innerHTML = `<div class="bg-amber-500/10 border border-amber-500/30 rounded-lg p-3 text-xs text-amber-200 mb-3"><strong>High risk.</strong> Tight stops only. Max 0.5–1% risk per trade. Skip if spreads are wide or during news. Protect capital first.</div>${scalps.map(s => renderCard(s, true)).join('')}`; }
    function renderNews() { document.getElementById('news').innerHTML = events.map(e => `<div class="bg-slate-900/60 rounded-lg p-4 border border-amber-500/20"><div class="flex items-center gap-2 mb-2"><i class="fas fa-bolt text-amber-400 text-sm"></i><span class="font-medium">${e.name}</span><span class="ml-auto text-[10px] bg-amber-500/10 text-amber-400 px-1.5 py-0.5 rounded">${e.impact}</span></div><p class="text-xs text-slate-400 mb-2">${e.date} • ${e.time}</p><div class="bg-slate-950/50 rounded p-2.5 text-xs">${e.note}</div></div>`).join(''); }
    function renderHistory() { const closed = [...history, ...signals.filter(s => s.status !== 'Active' && s.status !== 'Watch')]; document.getElementById('history').innerHTML = `<div class="bg-slate-900/60 rounded-lg border border-slate-800 overflow-hidden text-xs"><table class="w-full"><thead class="bg-slate-950"><tr class="text-slate-500"><th class="text-left p-2.5">Time</th><th class="text-left p-2.5">Dir</th><th class="text-left p-2.5">Entry</th><th class="text-left p-2.5">Status</th></tr></thead><tbody>${closed.slice(-30).reverse().map(h => `<tr class="border-t border-slate-800"><td class="p-2.5">${h.time || '—'}</td><td class="${h.dir === 'BUY' ? 'text-emerald-400' : 'text-red-400'}">${h.dir}</td><td>${h.entry}</td><td>${h.status}</td></tr>`).join('') || '<tr><td colspan="4" class="p-3 text-slate-500">No history yet</td></tr>'}</tbody></table></div>`; }
    function renderAdmin() { document.getElementById('admin').innerHTML = `<div class="bg-slate-900/60 rounded-lg p-5 border border-slate-800 max-w-lg"><h3 class="font-medium mb-4">Post New Signal</h3><form onsubmit="addSignal(event)" class="space-y-3 text-sm"><div class="grid grid-cols-2 gap-3"><select id="dir" class="bg-slate-800 border border-slate-700 rounded px-3 py-2"><option>BUY</option><option>SELL</option></select><select id="type" class="bg-slate-800 border border-slate-700 rounded px-3 py-2"><option value="swing">Swing / Normal</option><option value="scalp">Scalp</option></select></div><div class="grid grid-cols-2 gap-3"><input id="entry" type="number" step="0.01" placeholder="Entry" required class="bg-slate-800 border border-slate-700 rounded px-3 py-2"><input id="sl" type="number" step="0.01" placeholder="Stop Loss" required class="bg-slate-800 border border-slate-700 rounded px-3 py-2"></div><div class="grid grid-cols-2 gap-3"><input id="tp1" type="number" step="0.01" placeholder="TP1" required class="bg-slate-800 border border-slate-700 rounded px-3 py-2"><input id="tp2" type="number" step="0.01" placeholder="TP2 (optional)" class="bg-slate-800 border border-slate-700 rounded px-3 py-2"></div><textarea id="context" placeholder="Full context / reasoning" rows="3" class="w-full bg-slate-800 border border-slate-700 rounded px-3 py-2"></textarea><button type="submit" class="w-full bg-amber-500 text-slate-900 font-medium py-2 rounded">Post Signal</button></form><p class="text-[11px] text-slate-500 mt-3">Signals are saved in this browser. Change status on any card to update history.</p></div>`; }
    function addSignal(e) { e.preventDefault(); const newSig = { id: Date.now(), dir: document.getElementById('dir').value, conf: "High", status: "Active", time: "Just now", entry: parseFloat(document.getElementById('entry').value), sl: parseFloat(document.getElementById('sl').value), tp1: parseFloat(document.getElementById('tp1').value), tp2: parseFloat(document.getElementById('tp2').value) || 0, context: document.getElementById('context').value || "Manual signal", type: document.getElementById('type').value }; signals.unshift(newSig); save(); renderSignals(); updateStats(); alert("Signal posted!"); e.target.reset(); showTab('signals'); }
    function updateStatus(id, status) { const s = signals.find(x => x.id === id) || scalps.find(x => x.id === id); if (s) { s.status = status; if (status !== 'Active' && status !== 'Watch') { history.push({ ...s, time: new Date().toLocaleString() }); } save(); renderSignals(); renderHistory(); updateStats(); } }
    async function fetchGoldPrice() { try { const res = await fetch('https://xaus.com/api/v1/spot?compact=1'); const data = await res.json(); livePrice = data.spot_usd_oz || data.xau?.price || 0; if (livePrice) { document.getElementById('livePrice').textContent = '$' + livePrice.toFixed(2); renderSignals(); renderScalping(); } } catch (e) {} }
    function updateStats() { const active = signals.filter(s => s.status === 'Active' || s.status === 'Watch').length; const wins = history.filter(h => h.status && h.status.includes('TP')).length; document.getElementById('winRate').textContent = history.length ? Math.round((wins / history.length) * 100) + '%' : '—'; document.getElementById('activeCount').textContent = active; document.getElementById('monthCount').textContent = signals.length + history.length; }
    renderSignals(); renderScalping(); renderNews(); renderHistory(); updateStats(); fetchGoldPrice(); setInterval(fetchGoldPrice, 15000);
  </script>
</body>
</html>
