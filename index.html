<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GoldEdge • Live Gold Signals</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body { background: #0a0f1e; color: #e2e8f0; }
    .signal-card { transition: all 0.2s ease; }
    .signal-card:hover { transform: translateY(-2px); }
    .buy { border-left: 3px solid #22c55e; }
    .sell { border-left: 3px solid #ef4444; }
  </style>
</head>
<body class="min-h-screen">
  <header class="bg-[#0f172a] border-b border-slate-800/80 sticky top-0 z-50 backdrop-blur">
    <div class="max-w-6xl mx-auto px-4 py-3.5 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 bg-gradient-to-br from-amber-400 to-amber-600 rounded-md flex items-center justify-center text-lg font-bold text-slate-900">G</div>
        <div>
          <h1 class="text-lg font-semibold tracking-tight">GoldEdge</h1>
          <p class="text-[11px] text-slate-500 -mt-0.5">XAUUSD Signals</p>
        </div>
      </div>
      <div class="flex items-center gap-5">
        <div class="text-right">
          <p class="text-[10px] text-slate-500 uppercase tracking-wider">Live</p>
          <p id="livePrice" class="text-base font-mono font-medium">—</p>
        </div>
        <span class="text-xs bg-emerald-500/10 text-emerald-400 px-2.5 py-1 rounded-full border border-emerald-500/20">Free</span>
      </div>
    </div>
  </header>
  <main class="max-w-6xl mx-auto px-4 py-6">
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6 text-sm">
      <div class="bg-slate-900/40 rounded-lg p-3 border border-slate-800"><p class="text-slate-500 text-xs">Win Rate</p><p class="text-xl font-semibold text-emerald-400" id="winRate">—</p></div>
      <div class="bg-slate-900/40 rounded-lg p-3 border border-slate-800"><p class="text-slate-500 text-xs">Avg R:R</p><p class="text-xl font-semibold" id="avgRR">—</p></div>
      <div class="bg-slate-900/40 rounded-lg p-3 border border-slate-800"><p class="text-slate-500 text-xs">This Month</p><p class="text-xl font-semibold" id="monthCount">—</p></div>
      <div class="bg-slate-900/40 rounded-lg p-3 border border-slate-800"><p class="text-slate-500 text-xs">Next Event</p><p class="text-xl font-semibold text-amber-400" id="nextEvent">NFP</p></div>
    </div>
    <div class="flex gap-1 mb-5 text-sm border-b border-slate-800">
      <button onclick="showTab('signals')" id="tab-signals" class="px-3 py-2 text-white border-b-2 border-amber-500 font-medium">Signals</button>
      <button onclick="showTab('news')" id="tab-news" class="px-3 py-2 text-slate-500 hover:text-slate-300">News</button>
      <button onclick="showTab('history')" id="tab-history" class="px-3 py-2 text-slate-500 hover:text-slate-300">History</button>
    </div>
    <div id="signals" class="space-y-3"></div>
    <div id="news" class="hidden space-y-3"></div>
    <div id="history" class="hidden"></div>
  </main>
  <footer class="border-t border-slate-800/60 mt-10 py-4 text-center text-[11px] text-slate-600">GoldEdge • Free XAUUSD signals • Not financial advice</footer>
  <script>
    const signals = [
      {dir:"BUY",conf:"High",status:"Active",time:"2h ago",entry:"2650.00",sl:"2638.00",tp1:"2668.00",tp2:"2685.00",context:"Liquidity sweep below 2642 + H1 bullish engulfing off 4H demand. HTF bias bullish. Invalidation below 2638."},
      {dir:"SELL",conf:"Medium",status:"Closed",time:"1d ago",entry:"2672.50",sl:"2684.00",tp1:"2655.00",tp2:"2640.00",context:"Weekly resistance rejection + H4 lower high. Closed at TP1 (+17.5 pips)."}
    ];
    const events = [
      {name:"Non-Farm Payrolls (NFP)",date:"Fri Nov 6",time:"08:30 ET",impact:"High",note:"Expect 80–150 pip moves. Wait for spike then fade extremes or trade confirmed breakouts."},
      {name:"US CPI",date:"Tue Nov 10",time:"08:30 ET",impact:"High",note:"Inflation data. Hotter print typically pressures gold; cooler print supports it."},
      {name:"FOMC Rate Decision",date:"Wed Dec 9",time:"14:00 ET",impact:"High",note:"Includes projections/dot plot. Major volatility expected."}
    ];
    const history = [
      {date:"Nov 4",dir:"BUY",entry:"2645",result:"TP2",pips:"+40"},
      {date:"Nov 3",dir:"SELL",entry:"2668",result:"SL",pips:"-12"},
      {date:"Nov 1",dir:"BUY",entry:"2632",result:"TP1",pips:"+22"}
    ];
    function showTab(tab){['signals','news','history'].forEach(t=>{document.getElementById(t).classList.add('hidden');const btn=document.getElementById('tab-'+t);btn.classList.remove('border-b-2','border-amber-500','text-white','font-medium');btn.classList.add('text-slate-500');});document.getElementById(tab).classList.remove('hidden');const active=document.getElementById('tab-'+tab);active.classList.add('border-b-2','border-amber-500','text-white','font-medium');active.classList.remove('text-slate-500');}
    function renderSignals(){const c=document.getElementById('signals');c.innerHTML=signals.map(s=>`<div class="signal-card bg-slate-900/60 rounded-lg p-4 border border-slate-800 ${s.dir==='BUY'?'buy':'sell'}"><div class="flex justify-between items-start mb-2.5"><div class="flex items-center gap-2"><span class="${s.dir==='BUY'?'bg-emerald-500':'bg-red-500'} text-white text-[10px] font-bold px-1.5 py-0.5 rounded">${s.dir}</span><span class="text-xs text-slate-400">XAUUSD</span><span class="text-[10px] text-amber-400">${s.conf}</span><span class="text-[10px] ${s.status==='Active'?'bg-blue-500/10 text-blue-400':'bg-slate-700 text-slate-300'} px-1.5 py-0.5 rounded">${s.status}</span></div><span class="text-[10px] text-slate-500">${s.time}</span></div><div class="grid grid-cols-4 gap-3 text-xs mb-3 font-mono"><div><span class="text-slate-500">Entry</span><p class="font-medium">${s.entry}</p></div><div><span class="text-slate-500">SL</span><p class="text-red-400">${s.sl}</p></div><div><span class="text-slate-500">TP1</span><p class="text-emerald-400">${s.tp1}</p></div><div><span class="text-slate-500">TP2</span><p class="text-emerald-400">${s.tp2}</p></div></div><div class="bg-slate-950/50 rounded p-2.5 text-xs leading-relaxed"><span class="text-amber-400 font-medium">Context:</span> ${s.context}</div></div>`).join('');}
    function renderNews(){const c=document.getElementById('news');c.innerHTML=events.map(e=>`<div class="bg-slate-900/60 rounded-lg p-4 border border-amber-500/20"><div class="flex items-center gap-2 mb-2"><i class="fas fa-bolt text-amber-400 text-sm"></i><span class="font-medium">${e.name}</span><span class="ml-auto text-[10px] bg-amber-500/10 text-amber-400 px-1.5 py-0.5 rounded">${e.impact}</span></div><p class="text-xs text-slate-400 mb-2">${e.date} • ${e.time}</p><div class="bg-slate-950/50 rounded p-2.5 text-xs">${e.note}</div></div>`).join('');}
    function renderHistory(){const c=document.getElementById('history');c.innerHTML=`<div class="bg-slate-900/60 rounded-lg border border-slate-800 overflow-hidden text-xs"><table class="w-full"><thead class="bg-slate-950"><tr class="text-slate-500"><th class="text-left p-2.5">Date</th><th class="text-left p-2.5">Dir</th><th class="text-left p-2.5">Entry</th><th class="text-left p-2.5">Result</th><th class="text-left p-2.5">Pips</th></tr></thead><tbody>${history.map(h=>`<tr class="border-t border-slate-800"><td class="p-2.5">${h.date}</td><td class="${h.dir==='BUY'?'text-emerald-400':'text-red-400'}">${h.dir}</td><td>${h.entry}</td><td class="${h.result.includes('TP')?'text-emerald-400':'text-red-400'}">${h.result}</td><td>${h.pips}</td></tr>`).join('')}</tbody></table></div>`;}
    async function fetchGoldPrice(){try{const res=await fetch('https://xaus.com/api/v1/spot?compact=1');const data=await res.json();const price=data.spot_usd_oz||data.xau?.price;if(price)document.getElementById('livePrice').textContent='$'+price.toFixed(2);}catch(e){document.getElementById('livePrice').textContent='—';}}
    function updateStats(){document.getElementById('winRate').textContent='68%';document.getElementById('avgRR').textContent='1:2.4';document.getElementById('monthCount').textContent='42';}
    renderSignals();renderNews();renderHistory();updateStats();fetchGoldPrice();setInterval(fetchGoldPrice,60000);
  </script>
</body>
</html>
